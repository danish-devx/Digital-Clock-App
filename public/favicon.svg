<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a2323"/>
      <stop offset="1" stop-color="#2b1313"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.65">
      <stop offset="0" stop-color="#ee806d" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ee806d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cherry" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb597"/>
      <stop offset="1" stop-color="#e0685a"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffdcc6"/>
      <stop offset="1" stop-color="#ff9f7e"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect width="64" height="64" rx="14" fill="url(#glow)"/>

  <!-- stem + leaf -->
  <path d="M32 23 C32 16 36 12.5 41 11" fill="none" stroke="#f6d4c3" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M41.5 10.5 C44 7 49 6.5 52.5 9.5 C51.5 14 46 15.5 41.5 10.5 Z" fill="url(#leaf)"/>

  <!-- cherry = clock face -->
  <circle cx="32" cy="38" r="15" fill="url(#cherry)"/>
  <circle cx="32" cy="38" r="11.5" fill="none" stroke="#fff8f0" stroke-opacity="0.4" stroke-width="1.2"/>

  <!-- ticks (12/3/6/9) -->
  <circle cx="32" cy="27.5" r="1.1" fill="#fff8f0" opacity="0.85"/>
  <circle cx="42.5" cy="38" r="1.1" fill="#fff8f0" opacity="0.85"/>
  <circle cx="32" cy="48.5" r="1.1" fill="#fff8f0" opacity="0.85"/>
  <circle cx="21.5" cy="38" r="1.1" fill="#fff8f0" opacity="0.85"/>

  <!-- hands at 10:10 -->
  <line x1="32" y1="38" x2="26" y2="34.5" stroke="#fff8f0" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="32" y1="38" x2="39.8" y2="33.5" stroke="#fff8f0" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="32" cy="38" r="1.9" fill="#3e1e1e"/>

  <!-- gloss highlight -->
  <ellipse cx="26.5" cy="30.5" rx="5" ry="3" fill="#ffffff" opacity="0.28" transform="rotate(-30 26.5 30.5)"/>
</svg>